    <style>
      html {
        background: #0a0e11;
      }
      body {
        margin: 0;
      }
      [hidden] {
        display: none !important;
      }
    </style>
    <script>
      try {
        var t = localStorage.getItem("bigtext-theme");
        if (t === "bw" || t === "wb") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}

    <title>Big Text</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet" />
    <style>
      /* Layout: a single canvas fills the window; typed digits scale to the largest size that fits. */
      :root {
        --bg: #e9edef;
        --fg: #0c1317;
        --hint: #56646c;
        --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
        --font-utility: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0a0e11;
          --fg: #e8f0f4;
          --hint: #87969f;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0a0e11;
        --fg: #e8f0f4;
        --hint: #87969f;
        color-scheme: dark;
      }
      /* h cycles: default (follows the system) -> black on white -> white on black */
      :root[data-theme="bw"] {
        background: #fff;
        --bg: #fff;
        --fg: #000;
        --hint: #555;
        color-scheme: light;
      }
      :root[data-theme="wb"] {
        background: #000;
        --bg: #000;
        --fg: #fff;
        --hint: #aaa;
        color-scheme: dark;
      }

      html,
      body {
        height: 100%;
      }
      * {
        cursor: none !important;
      }
      body {
        box-sizing: border-box;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        padding-top: max(16px, env(safe-area-inset-top, 0px));
        padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        -webkit-user-select: none;
        user-select: none;
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
      }
      /* On-screen controls: shown on touch screens, or with m. The stage shrinks to make room. */
      #pad {
        display: flex;
        gap: 6px;
        height: 44px;
        margin-bottom: 8px;
        overflow-x: auto;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      #pad::-webkit-scrollbar {
        display: none;
      }
      #pad {
        -webkit-tap-highlight-color: transparent;
      }
      body.has-pad #stage {
        height: calc(100% - 52px);
      }
      #pad button {
        flex: 0 0 auto;
        min-width: 44px;
        padding: 0 12px;
        border: 1px solid var(--hint);
        border-radius: 8px;
        background: transparent;
        color: var(--fg);
        font: 400 12px var(--font-utility);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      #pad button[aria-pressed="true"] {
        background: var(--fg);
        color: var(--bg);
      }
      #pad button:active {
        opacity: 0.6;
      }
      #pad,
      #pad button {
        cursor: pointer !important;
      }
      #c {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #hint {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: var(--font-utility);
        font-size: 13px;
        line-height: 1.8;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--hint);
        background: var(--bg);
        z-index: 1;
        pointer-events: none;
      }
      #help {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: var(--font-utility);
        font-size: 13px;
        line-height: 2;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--fg);
        background: var(--bg);
        z-index: 3;
      }
      #mode {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 0 16px 14px;
        text-align: center;
        font-family: var(--font-utility);
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--hint);
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #mode {
          transition: none;
        }
      }
      #entry {
        position: fixed;
        top: 0;
        left: 0;
        width: 1px;
        height: 1px;
        padding: 0;
        border: 0;
        opacity: 0;
        font-size: 16px;
        outline: none;
        resize: none;
        overflow: hidden;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
    </style>

      <button type="button" data-act="left" data-for="num" aria-label="Previous number">&#9664;</button>
      <button type="button" data-act="right" data-for="num" aria-label="Next number">&#9654;</button>
      <button type="button" data-act="down" data-for="num" aria-label="Back 37">&#9660;</button>
      <button type="button" data-act="up" data-for="num" aria-label="Forward 37">&#9650;</button>
      <button type="button" data-act="minus" aria-label="Smaller">&minus;</button>
      <button type="button" data-act="plus" aria-label="Bigger">+</button>

    <main id="stage">
      <canvas id="c" aria-hidden="true"></canvas>
      <p id="hint">Type ? or / to see shortcuts</p>
      <div id="help" role="dialog" aria-label="Shortcuts" hidden></div>
      <div id="live" class="sr" role="status" aria-live="polite"></div>
      <div id="mode" aria-hidden="true"></div>
      <textarea
        id="entry"
        rows="1"
        enterkeyhint="enter"
        inputmode="numeric"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="Number to display"></textarea>
    </main>

        function enjoyerNumber(n, label) {
          var refs = ENJOYER_REFS[n] || [];
          for (var i = 0; i < refs.length; i++) {
            if (refs[i][0] === label) return refs[i][1];
          }
          return "-";
        }

        function addEnjoyerRefs(out, n) {
          var refs = ENJOYER_REFS[n] || [];
          for (var i = 0; i < refs.length; i++) {
            var label = refs[i][0], existing = null;
            for (var j = 0; j < out.length; j++) {
              if (out[j].label === label) { existing = out[j]; break; }
            }
            // Keep the original book entry, and show only additional source numbers.
            var oldNumbers = existing ? existing.num.split(/\s*\/\s*/) : [];
            var added = refs[i][1].split(/\s*\/\s*/).filter(function (num) {
              return oldNumbers.indexOf(num) < 0;
            });
            if (!added.length) continue;
            if (existing && existing.num === "-") {
              existing.num = added.join(" / ");
            } else {
              out.push({ label: label + " (Enjoyer)", num: added.join(" / ") });
            }
          }
          return out;
        }

        function currentRefs() {
          if (textMode || !value) return null;
          var n = parseInt(value, 10);
          if (!(n >= 1 && n <= 1348)) return null;
          var cells = (XREF[n] || "").split(","),
            out = [],
            i;
          if (langOn) {
            for (i = 0; i < XREF_LABELS.length; i++) {
              var label = XREF_LABELS[i];
              if (cells[i] || label === "Chinese" || label === "Spanish 2nd" || label === "Spanish 1st") {
                out.push({ label: label, num: cells[i] || "-" });
              }
            }
            addEnjoyerRefs(out, n);
            return out.length ? out : null;
          }
          for (i = 0; i < QUICK_ORDER.length; i++) {
            var key = QUICK_ORDER[i];
            if (!picked[key] && !(engOn && (ENG_SET[key] || (engAlt && key === "k")))) continue;
            var labels = key === "s" ? ["Spanish 2nd", "Spanish 1st"] : [QUICK[key]];
            for (var j = 0; j < labels.length; j++) {
              var idx = XREF_LABELS.indexOf(labels[j]);
              var num = idx >= 0 && cells[idx] ? cells[idx] : "-";
              if (engOn && (labels[j] === "Burmese" || (engAlt && labels[j] === "Korean"))) {
                num = enjoyerNumber(n, labels[j]);
              }
              // Chinese 9000+ codes are shown only in All Languages mode.
              if (labels[j] === "Chinese" && Number(num) >= 9000) num = "-";
              out.push({ label: labels[j], num: num });
            }
          }
          if (engOn && !engAlt) {
            out.push({ label: "Russian", num: enjoyerNumber(n, "Russian") });
          }
          return out.length ? out : null;
        }

        function toggleEng(alternate) {
          alternate = alternate === true;
          if (langOn) {
            flash("Press l to turn off all languages first");
            return;
          }
          engOn = !(engOn && engAlt === alternate);
          engAlt = engOn && alternate;
          announce();
          draw();
          flash(engOn ? "English + Korean main · Chinese, Spanish, Burmese" + (engAlt ? ", Enjoyer Korean" : ", Russian") + " below" : "English view off");
        }

        function toggleQuick(key) {
          if (langOn) {
            flash("Press l to turn off all languages first");
            return;
          }
          picked[key] = !picked[key];
          announce();
          draw();
          flash(QUICK[key] + (picked[key] ? " on" : " off"));
        }

        function panelLayout(refs) {
          var n = refs.length;
          var ekMode = engOn && !textMode && !langOn;
          if (ekMode) {
            var order = ["Burmese", "Chinese", "Spanish 1st", "Spanish 2nd", "Korean", "Russian"];
            refs = refs.slice().sort(function (a, b) {
              var ai = order.indexOf(a.label), bi = order.indexOf(b.label);
              return (ai < 0 ? order.length : ai) - (bi < 0 ? order.length : bi);
            });
          }
          var maxCols = ekMode ? 2 : Math.max(1, Math.min(5, Math.floor(W / 130)));
          var rows = Math.ceil(n / maxCols);
          var cols = ekMode ? 2 : Math.ceil(n / rows);
          return { refs: refs, rows: rows, cols: cols, h: H * Math.min(ekMode ? 0.6 : 0.5, (0.14 * rows + 0.08) * (ekMode ? 1.5 : 1) * panelScale) };
        }

        // Letter-spacing on canvas (ignored by browsers that lack it).
        function setSpacing(px) {
          try {
            ctx.letterSpacing = px + "px";
          } catch (e) {}
        }

        // E/K label that sits to the left of the main number: thin gray mono, sized with the number.
        var MONO_FACE = 'px \"IBM Plex Mono\", ui-monospace, Menlo, monospace';
        function engLabel(S) {
          var px = Math.max(24, Math.min(360, S * 0.65));
          ctx.save();
          ctx.font = "500 " + px + MONO_FACE;
          setSpacing(-px * 0.08); // tighter than the font's wide monospace spacing
          var lw = ctx.measureText("E/K").width;
          ctx.restore();
          return { px: px, w: lw, gap: px * 0.5, total: lw + px * 0.5, sp: -px * 0.08 };
        }

        function panelAbbreviation(label) {
          if (label === "Spanish 1st") return "S1";
          if (label === "Spanish 2nd") return "S2";
          return label.charAt(0).toUpperCase();
        }

        function drawPanel(p) {
          paintColors();
          var rowH = (p.h - PANEL_PAD) / p.rows,
            cellW = W / p.cols;
          var fg = fgColor;
          ctx.font = "900 100px " + FAMILY;
          var asc100 = ctx.measureText("0").actualBoundingBoxAscent || 70;
          var widest = 1;
          for (var i = 0; i < p.refs.length; i++) widest = Math.max(widest, ctx.measureText(p.refs[i].num).width);
          var labelPx = Math.max(11, Math.min(20, rowH * 0.2, cellW / 6));
          var inlineLabels = engOn && !textMode && !langOn;
          if (!inlineLabels) {
            ctx.font = "500 100px \"IBM Plex Mono\", ui-monospace, Menlo, monospace";

            return;
          }
          if (e && (e.inputType === "insertLineBreak" || e.inputType === "insertParagraph")) {
            clearAll();
            return;
          }
          var cur = input.value;
          if (cur === synced) return;
          // Find what changed regardless of where the caret was: shared start, shared end, middle differs.
          var i = 0,
            max = Math.min(cur.length, synced.length);
          while (i < max && cur.charAt(i) === synced.charAt(i)) i++;
          var j = 0,
            maxj = max - i;
          while (j < maxj && cur.charAt(cur.length - 1 - j) === synced.charAt(synced.length - 1 - j)) j++;
          var removed = synced.length - i - j;
          var added = digitsOf(cur.slice(i, cur.length - j));
          // Digits always go on the end. A real backspace removes exactly one character; a bigger
          // removal is the keyboard resetting its buffer (Enter, commit), so it is ignored.
          setValue((removed === 1 && !added ? value.slice(0, -1) : added ? digitBase() : value) + added);
        });

        document.addEventListener("pointerdown", function (e) {
          if (helpOpen && !(pad && pad.contains(e.target))) hideHelp();
          focusInput();
        });
        window.addEventListener("focus", focusInput);
        focusInput();

        if (window.ResizeObserver) {
          new ResizeObserver(resize).observe(stage);
        } else {
          window.addEventListener("resize", resize);
        }

        // The theme is the only thing that changes the cached colors; a change marks them stale and
        // repaints so the digit colour follows.
        var themeChanged = function () {
          colorsStale = true;
          scheduleDraw();
        };
        try {
          var mq = window.matchMedia("(prefers-color-scheme: dark)");
          if (mq.addEventListener) mq.addEventListener("change", themeChanged);
        } catch (e) {}
        new MutationObserver(themeChanged).observe(document.documentElement, {
          attributes: true,
          attributeFilter: ["data-theme"],
        });

        // Redraw once the display face has loaded (a font load can fire several times; the
        // rAF queue collapses them into one paint).
        if (document.fonts && document.fonts.load) {
          document.fonts.load('900 100px "Big Shoulders Display"').then(scheduleDraw, function () {});
          document.fonts.load('500 12px "IBM Plex Mono"').then(scheduleDraw, function () {});
          document.fonts.ready.then(scheduleDraw);
        }

        resize();
      })();
    </script>

    <script>
      if ("serviceWorker" in navigator)
        addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function () {});
        });
    </script>
  </body>
</html>
