/* Layout: a single canvas fills the window; typed digits scale to the largest size that fits. */
:root {
  --bg: #e9edef;
  --fg: #0c1317;
  --hint: #56646c;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-utility: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0e11;
    --fg: #e8f0f4;
    --hint: #87969f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0e11;
  --fg: #e8f0f4;
  --hint: #87969f;
  color-scheme: dark;
}
/* h cycles: default (follows the system) -> black on white -> white on black */
:root[data-theme="bw"] {
  background: #fff;
  --bg: #fff;
  --fg: #000;
  --hint: #555;
  color-scheme: light;
}
:root[data-theme="wb"] {
  background: #000;
  --bg: #000;
  --fg: #fff;
  --hint: #aaa;
  color-scheme: dark;
}

html, body { height: 100%; }
* { cursor: none !important; }
body {
  box-sizing: border-box;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none;
  user-select: none;
}
#stage { position: relative; width: 100%; height: 100%; }
/* On-screen controls: shown on touch screens, or with m. The stage shrinks to make room. */
#pad {
  display: flex;
  gap: 6px;
  height: 44px;
  margin-bottom: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
#pad::-webkit-scrollbar { display: none; }
#pad { -webkit-tap-highlight-color: transparent; }
body.has-pad #stage { height: calc(100% - 52px); }
#pad button {
  flex: 0 0 auto;
  min-width: 44px;
  padding: 0 12px;
  border: 1px solid var(--hint);
  border-radius: 8px;
  background: transparent;
  color: var(--fg);
  font: 400 12px var(--font-utility);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
#pad button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
#pad button:active { opacity: 0.6; }
#pad, #pad button { cursor: pointer !important; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#hint {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-family: var(--font-utility);
  font-size: 13px;
  line-height: 1.8;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--hint);
  background: var(--bg);
  z-index: 1;
  pointer-events: none;
}
#help {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-family: var(--font-utility);
  font-size: 13px;
  line-height: 2;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg);
  background: var(--bg);
  z-index: 3;
}
#mode {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 0 16px 14px;
  text-align: center;
  font-family: var(--font-utility);
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--hint);
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
@media (prefers-reduced-motion: reduce) { #mode { transition: none; } }
#entry {
  position: fixed;
  top: 0;
  left: 0;
  width: 1px;
  height: 1px;
  padding: 0;
  border: 0;
  opacity: 0;
  font-size: 16px;
  outline: none;
  resize: none;
  overflow: hidden;
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

    }
    fitSize = size;
    // Manual size (set with -/+) overrides the fill size until "f" is pressed.
    // With the panel showing, the main number just fills what the panel leaves (see adjustSize).
    if (manualSize !== null && !panel) {
      size = manualSize;
      if (wrapOn) lines = packAll(displayValue, (W - (res ? res(size) : 0)) * 100 / size, w);
    }

    // Measure again at the final size and centre the ink in the window.
    ctx.font = '900 ' + size + 'px ' + FAMILY;
    m = ctx.measureText(flat);
    z = ctx.measureText('0');
    var vb = inkV(m, z);
    var inkH = vb.asc + vb.desc;
    var lineH = inkH * 1.12;
    var y0 = (availH - ((lines.length - 1) * lineH + inkH)) / 2 + vb.asc + engLabelH;
    var lab = showEng ? engLabel(size) : null;
    var resW = lab ? lab.total : 0;
    for (var i = 0; i < lines.length; i++) {
      var lm = ctx.measureText(lines[i]);
      var ll = lm.actualBoundingBoxLeft;
      var inkLeft = (W - resW - ll - lm.actualBoundingBoxRight) / 2 + resW;
      var lineX = inkLeft + ll;
      ctx.fillText(lines[i], lineX, y0 + i * lineH);
      if (lab && i === 0) {
        ctx.save();
        ctx.fillStyle = hintColor;
        ctx.globalAlpha = 0.8;
        ctx.font = '500 ' + lab.px + MONO_FACE;
        ctx.textAlign = 'left';
        setSpacing(lab.sp);
        ctx.fillText('E/K', inkLeft - lab.gap - lab.w, y0 - (vb.asc - vb.desc) / 2 + lab.px * 0.35);
        ctx.restore();
      }
    }
    if (panel) drawPanel(panel);
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    var r = stage.getBoundingClientRect();
    W = Math.max(1, r.width);
    H = Math.max(1, r.height);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    scheduleDraw();
  }

  function setValue(v) {
    value = textMode
      ? String(v).replace(/\r\n?/g, '\n').replace(/\t/g, '')
      : String(v).replace(/\D/g, '');
    if (input.value !== value) {
      input.value = value;
      try { input.setSelectionRange(value.length, value.length); } catch (e) {}
    }
    synced = value;
    if (value) hintCleared = false;
    announce();
    draw();
  }

  // Digits keep a fixed height (from "0"); text uses its own ink so descenders fit.
  function inkV(m, z) {
    var s = textMode ? m : z;
    return { asc: s.actualBoundingBoxAscent, desc: s.actualBoundingBoxDescent };
  }

  var modeEl = document.getElementById('mode');
  var modeTimer = 0;
  function flash(msg) {
    modeEl.textContent = msg;
    modeEl.style.opacity = '1';
    clearTimeout(modeTimer);
    modeTimer = setTimeout(function () { modeEl.style.opacity = '0'; }, 1800);
  }

  // h (number mode) cycles the colour theme: default, black on white, white on black.
  var THEMES = [
    { attr: null, name: 'Default', bar: '#0a0e11' },
    { attr: 'bw', name: 'Black on white', bar: '#ffffff' },
    { attr: 'wb', name: 'White on black', bar: '#000000' }
  ];
  var themeIdx = 0;
  var themeMeta = document.querySelector('meta[name="theme-color"]');
  function applyTheme(i) {
    themeIdx = i;
    var t = THEMES[i], root = document.documentElement;
    if (t.attr) root.setAttribute('data-theme', t.attr); else root.removeAttribute('data-theme');
    if (themeMeta) themeMeta.setAttribute('content', t.bar);
  }
  function cycleTheme() {
    applyTheme((themeIdx + 1) % THEMES.length);
    try {
      if (THEMES[themeIdx].attr) localStorage.setItem('bigtext-theme', THEMES[themeIdx].attr);
      else localStorage.removeItem('bigtext-theme');
    } catch (e) {}
    flash('Theme \u00b7 ' + THEMES[themeIdx].name);
  }
  (function () {
    var saved = document.documentElement.getAttribute('data-theme');
    for (var i = 1; i < THEMES.length; i++) if (THEMES[i].attr === saved) applyTheme(i);
  })();

  function updateHint() {
    // The empty screen only points to the shortcut list (? opens it).
    hint.textContent = textMode ? 'Press ' + MOD + ' + ? to see shortcuts' : 'Type ? or / to see shortcuts';
    hint.style.visibility = '';
    hint.hidden = value.length > 0;
  }

  function helpHtml() {
    var d = ' &middot; ';
    var lines = textMode ? [
      'Type anything &middot; enter new line &middot; backspace deletes',
      MOD + '+delete clears' + d + MOD + '+z undoes a clear' + d + MOD + '+c copies',
      MOD + ' + - / + size' + d + MOD + '+f fill' + d + 'alt+w wrap',
      MOD + '+\\ or esc number mode',
      'any key closes this'
    ] : [
      'Type numbers &middot; backspace deletes &middot; enter clears &middot; u undoes a clear &middot; ' + MOD + '+z also undoes',
      '&larr; / &rarr; &plusmn;1' + d + '&uarr; / &darr; &plusmn;37' + d + 'next digit then starts over',
      '- / + size (with other languages showing, they resize the opposite way)',
      'f fill' + d + 'shift+f full screen' + d + 'w wrap' + d + 'h theme' + d + 'm buttons' + d + 't text mode',
      'l all languages' + d + 'c k s b chinese, korean, spanish, burmese' + d + 'e english + korean',
      'any key closes this'
    ];
    return lines.join('<br>');
  }
  function showHelp() { helpEl.innerHTML = helpHtml(); helpEl.hidden = false; helpOpen = true; }
  function hideHelp() { helpEl.hidden = true; helpOpen = false; }

  // Undo: whatever was last cleared comes back (switching modes if it was typed in the other one).
  // If something is on screen now, it becomes the new undo, so a second press swaps back.
  function stash() { if (value) undoBuf = { value: value, text: textMode }; }
  function clearAll() { stash(); arrowFresh = false; resetSize(); setValue(''); }
  function undo() {
    if (!undoBuf) { flash('Nothing to restore'); return; }
    var u = undoBuf;
    undoBuf = value ? { value: value, text: textMode } : null;
    if (textMode !== u.text) setMode(u.text, true);
    resetSize();
    setValue(u.value);
    flash('Restored');
  }

  function setMode(on, keep) {
    var had = !!value;
    hideHelp();
    if (!keep) stash();
    textMode = on;
    arrowFresh = false;
    hintCleared = false; // the hint is rebuilt for the new mode by updateHint()
    input.setAttribute('inputmode', on ? 'text' : 'numeric');
    input.setAttribute('aria-label', on ? 'Text to display' : 'Number to display');
    
    canvas.width = canvas.width; // wipe anything left on the canvas from the previous mode
    if (!keep) {
      resetSize();
      setValue(''); // switching modes always starts with a clean slate
    }
    updateHint();
    if (!keep) flash((on ? 'Text mode · esc for numbers' : 'Number mode') + (had ? ' · cmd+z restores' : ''));
    try { input.blur(); } catch (e) {}
    focusInput();
  }

  function focusInput() {
    try { input.focus({ preventScroll: true }); } catch (e) {}
  }

  function toggleFullscreen() {
    try {
      var p = document.fullscreenElement
        ? document.exitFullscreen()
        : document.documentElement.requestFullscreen();
      if (p && p.catch) p.catch(function () {});
    } catch (err) {}
  }

  // Arrow keys / buttons: +-1 and +-37, and the next digit typed starts a new number.
  function step(dir) {
    arrowFresh = true;
    if (!value && (dir === 'left' || dir === 'down')) return;
    var cur = value ? parseInt(value, 10) : 0;
    if (isNaN(cur)) cur = 0;
    var d = dir === 'right' ? 1 : dir === 'left' ? -1 : dir === 'up' ? 37 : -37;
    setValue(String(Math.max(1, Math.min(1348, cur + d))));
  }

  // ---- On-screen buttons ----
  var padOn = false;
  function setPad(on, save) {
    padOn = on;
    pad.hidden = !on;
    document.body.classList.toggle('has-pad', on);
    if (save) { try { localStorage.setItem('bigtext-pad', on ? '1' : '0'); } catch (e) {} }
    if (on) syncPad();
  }
  var PRESSED = {
    lang: function () { return langOn; }, eng: function () { return engOn; }, wrap: function () { return wrapOn; },
    c: function () { return !!picked.c; }, k: function () { return !!picked.k; },
    s: function () { return !!picked.s; }, b: function () { return !!picked.b; }
  };
  function syncPad() {
    if (!padOn) return;
    var btns = pad.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) {
      var b = btns[i], f = b.getAttribute('data-for'), a = b.getAttribute('data-act');
      b.hidden = (f === 'num' && textMode) || (f === 'text' && !textMode);
      if (b.hasAttribute('data-toggle') && PRESSED[a]) b.setAttribute('aria-pressed', PRESSED[a]() ? 'true' : 'false');
    }
  }
  var ACTIONS = {
    left: function () { step('left'); }, right: function () { step('right'); },
    up: function () { step('up'); }, down: function () { step('down'); },
    minus: function () { adjustSize(false); }, plus: function () { adjustSize(true); },
    fill: function () { resetSize(); draw(); },
    clear: clearAll, undo: undo, theme: cycleTheme, lang: toggleLang, eng: toggleEng,
    c: function () { toggleQuick('c'); }, k: function () { toggleQuick('k'); },
    s: function () { toggleQuick('s'); }, b: function () { toggleQuick('b'); },
    wrap: toggleWrap, text: function () { setMode(true); }, num: function () { setMode(false); },
    copy: copyValue, full: toggleFullscreen, help: showHelp
  };
  // mousedown is cancelled so a tap never takes focus from the hidden field (the keyboard stays up).
  pad.addEventListener('mousedown', function (e) { e.preventDefault(); });
  pad.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    var fn = b && ACTIONS[b.getAttribute('data-act')];
    if (fn) { fn(); focusInput(); }
  });
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('bigtext-pad'); } catch (e) {}
    var coarse = false;
    try { coarse = window.matchMedia('(pointer: coarse)').matches; } catch (e) {}
    setPad(saved === null ? coarse : saved === '1', false);
  })();

  document.addEventListener('keydown', function (e) {
    // While the shortcut list is open, a plain key closes it; browser combos (ctrl/cmd/alt) still work.
    if (helpOpen && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); hideHelp(); return; }
    // Command (Ctrl on Windows/Linux) shortcuts work in both modes, including while typing text.
    if ((e.metaKey || e.ctrlKey) && !e.altKey) {
      var k = e.key, c = e.code, handled = true;
      if (k === 'Backspace' || k === 'Delete') {
        clearAll();
      } else if (k === '?' || k === '/' || c === 'Slash') {
        showHelp();
      } else if (k === 'z' || k === 'Z') {
        undo();
      } else if (k === '-' || k === '_' || k === '+' || k === '=' || c === 'Minus' || c === 'Equal') {
        adjustSize(k === '+' || k === '=' || c === 'Equal');
      } else if (k === 'c' || k === 'C') {
        copyValue();
      } else if (k === 'f' || k === 'F') {
        resetSize();
        draw();
      } else if (k === '\\' || c === 'Backslash') {
        setMode(!textMode);
      } else {
        handled = false;
      }
      if (handled) { e.preventDefault(); return; }
    }
    if (e.altKey && !e.ctrlKey && !e.metaKey && e.code === 'KeyW') {
      e.preventDefault();
      toggleWrap();
      return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.isComposing) return;
    if (e.key === 'Enter') {
      e.preventDefault();
      if (textMode) setValue(value + '\n');
      else clearAll(); // number mode: Enter clears
      return;
    }
    if (textMode) {
      if (e.key === 'Escape') { e.preventDefault(); setMode(false); }
      else if (e.key === 'Backspace') { e.preventDefault(); setValue(value.slice(0, -1)); }
      else if (e.key.length === 1) { e.preventDefault(); setValue(value + e.key); }
      return;
    }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault();
      step(e.key.slice(5).toLowerCase());
      return;
    }
    if (e.key === '?' || e.key === '/') {
      e.preventDefault();
      showHelp();
      return;
    }
    if (e.key === 'u' || e.key === 'U') {
      e.preventDefault();
      undo();
      return;
    }
    if (e.key === 'm' || e.key === 'M') {
      e.preventDefault();
      setPad(!padOn, true);
      return;
    }
    if (e.key === 'l' || e.key === 'L') {
      e.preventDefault();
      toggleLang();
      return;
    }
    if (e.key === 'h' || e.key === 'H') {
      e.preventDefault();
      cycleTheme();
      return;
    }
    if (e.key === 't' || e.key === 'T') {
      e.preventDefault();
      setMode(true);
      return;
    }
    if (e.key === 'e' || e.key === 'E') {
      e.preventDefault();
      toggleEng();
      return;
    }
    var qk = e.key.toLowerCase();
    if (QUICK[qk]) {
      e.preventDefault();
      toggleQuick(qk);
      return;
    }
    if (e.key === 'w' || e.key === 'W') {
      e.preventDefault();
      toggleWrap();
      return;
    }
    if (/^[0-9]$/.test(e.key)) {
      e.preventDefault();
      setValue(digitBase() + e.key);
    } else if (e.key === '-' || e.key === '_' || e.key === '+' || e.key === '=') {
      e.preventDefault();
      adjustSize(e.key === '+' || e.key === '=');
    } else if (e.key === 'f') {
      e.preventDefault();
      resetSize();
      draw();
    } else if (e.key === 'F') {
      e.preventDefault();
      toggleFullscreen();
    } else if (e.key === 'Backspace') {
      e.preventDefault();
      arrowFresh = false;
      setValue(value.slice(0, -1));
    }
  });

  // Touch keyboards often skip keydown, so the hidden field catches their input.
  // In number mode the field is never trusted as the new value: arrow keys and Enter leave the
  // keyboard's own text buffer out of step with it, so reading the field back wiped the number.
  // beforeinput is cancelled where possible; otherwise the input event is applied as a change.
  function digitsOf(t) { return String(t || '').replace(/\D/g, ''); }

  input.addEventListener('beforeinput', function (e) {
    if (e.isComposing) return;
    var t = e.inputType || '';
    if (textMode) {
      if ((t === 'insertLineBreak' || t === 'insertParagraph') && e.cancelable) { e.preventDefault(); setValue(value + '\n'); }
      return;
    }
    if (t === 'insertLineBreak' || t === 'insertParagraph') {
      if (e.cancelable) { e.preventDefault(); clearAll(); }
    } else if (t === 'deleteContentBackward') {
      if (e.cancelable) { e.preventDefault(); setValue(value.slice(0, -1)); }
    } else if (t === 'insertText' || t === 'insertFromPaste' || t === 'insertFromDrop') {
      if (e.cancelable) {
        e.preventDefault();
        var d = digitsOf(e.data != null ? e.data : (e.dataTransfer && e.dataTransfer.getData('text')));
        if (d) setValue(digitBase() + d);
      }
    }
  });

  input.addEventListener('input', function (e) {
    if (textMode) { setValue(input.value); return; }
    if (e && (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph')) { clearAll(); return; }
    var cur = input.value;
    if (cur === synced) return;
    // Find what changed regardless of where the caret was: shared start, shared end, middle differs.
    var i = 0, max = Math.min(cur.length, synced.length);
    while (i < max && cur.charAt(i) === synced.charAt(i)) i++;
    var j = 0, maxj = max - i;
    while (j < maxj && cur.charAt(cur.length - 1 - j) === synced.charAt(synced.length - 1 - j)) j++;
    var removed = synced.length - i - j;
    var added = digitsOf(cur.slice(i, cur.length - j));
    // Digits always go on the end. A real backspace removes exactly one character; a bigger
    // removal is the keyboard resetting its buffer (Enter, commit), so it is ignored.
    setValue((removed === 1 && !added ? value.slice(0, -1) : (added ? digitBase() : value)) + added);
  });

  document.addEventListener('pointerdown', function (e) {
    if (helpOpen && !(pad && pad.contains(e.target))) hideHelp();
    focusInput();
  });
  window.addEventListener('focus', focusInput);
  focusInput();

  if (window.ResizeObserver) {
    new ResizeObserver(resize).observe(stage);
  } else {
    window.addEventListener('resize', resize);
  }

  // The theme is the only thing that changes the cached colors; a change marks them stale and
  // repaints so the digit colour follows.
  var themeChanged = function () { colorsStale = true; scheduleDraw(); };
  try {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', themeChanged);
  } catch (e) {}
  new MutationObserver(themeChanged).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // Redraw once the display face has loaded (a font load can fire several times; the
  // rAF queue collapses them into one paint).
  if (document.fonts && document.fonts.load) {
    document.fonts.load('900 100px "Big Shoulders Display"').then(scheduleDraw, function () {});
    document.fonts.load('500 12px "IBM Plex Mono"').then(scheduleDraw, function () {});
    document.fonts.ready.then(scheduleDraw);
  }

  resize();
})();
</script>

<script>
if ("serviceWorker" in navigator) addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
</script>
</body>
