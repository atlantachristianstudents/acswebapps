<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>App Name — ACS Web Apps</title>
  <meta name="description" content="One-sentence description of this app.">
  <meta name="theme-color" content="#3b4bf5" />
  <meta name="color-scheme" content="light dark" />

  <script>
    // Offline support: cache the app with sw.js (see README).
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }

  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fc;
      --text: #182033;
      --muted: #68738a;
      --border: #e7e9f0;
      --accent: #3b4bf5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d111b;
        --text: #edf0fa;
        --muted: #9ba7bd;
        --border: #273047;
        --accent: #7886ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .6rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .topbar a {
      display: inline-block;
      padding: .4rem .8rem;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: .85rem;
      font-weight: 600;
      transition: background .15s;
    }
    .topbar span { color: var(--muted); }
    main { padding: 1.5rem; }
    h1 { font-weight: 700; letter-spacing: -.03em; }

    .acswebapps-help { position: fixed; right: max(20px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom)); z-index: 1000; background: var(--bg, Canvas); border-radius: 50%; display: inline-block; font: 14px/1.5 system-ui, sans-serif; color: inherit; }
    .acswebapps-help > summary { display: block; list-style: none; cursor: pointer; border: 1px solid currentColor; border-radius: 50%; width: 32px; height: 32px; line-height: 30px; text-align: center; box-sizing: border-box; }
    .acswebapps-help > summary::-webkit-details-marker { display: none; }
    .acswebapps-help > nav { position: absolute; bottom: calc(100% + 8px); right: 0; z-index: 1000; width: 240px; max-width: calc(100vw - 64px); box-sizing: border-box; padding: 12px; border: 1px solid currentColor; border-radius: 8px; background: var(--bg, Canvas); color: inherit; white-space: normal; box-shadow: 0 4px 16px #0002; }
  </style>

<style id="acswebapps-no-pinch-style">html{touch-action:pan-x pan-y}</style>
<script id="acswebapps-no-pinch">
// Keep browser pinch zoom from interfering with app gestures; preserve single-finger scrolling.
(function () {
  function preventPinch(event) { if (event.cancelable) event.preventDefault(); }
  document.addEventListener('gesturestart', preventPinch, { passive: false });
  document.addEventListener('gesturechange', preventPinch, { passive: false });
  document.addEventListener('touchmove', function (event) {
    if (event.touches.length > 1) preventPinch(event);
  }, { passive: false });
  document.addEventListener('wheel', function (event) {
    if (event.ctrlKey) preventPinch(event);
  }, { passive: false });
}());
</script>

<style id="acswebapps-update-style">
.acs-update{margin-top:14px;padding-top:12px;border-top:1px solid currentColor;white-space:normal;font:13px/1.5 system-ui,sans-serif;letter-spacing:normal;text-transform:none;text-align:left}
.acs-update [data-acs-update-button]{display:inline-block;min-height:44px;max-width:100%;border:1px solid currentColor;border-radius:8px;padding:8px 12px;background:transparent;color:inherit;font:600 13px system-ui,sans-serif;cursor:pointer;letter-spacing:normal;text-transform:none}
.acs-update [data-acs-update-button]:disabled{opacity:.55;cursor:wait}
.acs-update [data-acs-update-button]:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.acs-update p{margin:6px 0 0!important;color:inherit!important;font:12px/1.5 system-ui,sans-serif;letter-spacing:normal;text-transform:none;overflow-wrap:anywhere}
.acs-update-note{opacity:.8}
[data-acs-update-status]:empty{display:none}
.update-row.acs-update{margin-top:0;padding-top:2px;border-top:0;font:inherit}
.update-row.acs-update p{margin:0!important}
</style>

  <div class="topbar">

  <main>

<details class="acswebapps-help"><summary aria-label="Help and navigation" title="Help and navigation">?</summary><nav aria-label="App navigation">App Name is part of the <a href="../../" style="color:inherit;text-decoration:underline">ACS Web Apps project</a>.<div class="acs-update" data-acs-update><button type="button" data-acs-update-button>Check for updates</button><p class="acs-update-note">Save your work first; an update restarts the app.</p><p data-acs-update-status role="status" aria-live="polite"></p></div></nav></details>

<script id="acswebapps-updater" data-version="app-template-v12">
// Self-contained app updater. Keep data-version aligned with this app's service-worker cache.
(function () {
  'use strict';
  const pageVersion = document.currentScript.dataset.version;
  let busy = false;
  function report(message) {
    document.querySelectorAll('[data-acs-update-status]').forEach(node => { node.textContent = message; });
  }
  function deadline(task, milliseconds) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(Error('The update check timed out. Please try again.')), milliseconds);
      Promise.resolve(task).then(value => { clearTimeout(timer); resolve(value); }, error => { clearTimeout(timer); reject(error); });
    });
  }
  function activate(worker) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => finish(Error('The update could not finish installing. Please try again.')), 30000);
      function finish(error) {
        clearTimeout(timer);
        worker.removeEventListener('statechange', inspect);
        if (error) reject(error); else resolve();
      }
      function inspect() {
        if (worker.state === 'redundant') finish(Error('The update did not install. Please try again.'));
        else if (worker.state === 'activated') finish();
        else if (worker.state === 'installed') {
          try { worker.postMessage({ type: 'ACS_SKIP_WAITING' }); } catch (error) { finish(error); }
        }
      }
      worker.addEventListener('statechange', inspect);
      inspect();
    });
  }
  function versionOf(worker) {
    return new Promise((resolve, reject) => {
      const channel = new MessageChannel();
      const timer = setTimeout(() => finish(Error('Could not verify the app version. Please try again.')), 5000);
      function finish(error, value) {
        clearTimeout(timer);
        channel.port1.close();
        if (error) reject(error); else resolve(value);
      }
      channel.port1.onmessage = event => {
        const version = event.data && event.data.version;
        if (typeof version !== 'string' || !/^.+-v\d+$/.test(version)) finish(Error('The app returned an invalid update version.'));
        else finish(null, version);
      };
      try { worker.postMessage({ type: 'ACS_GET_VERSION' }, [channel.port2]); } catch (error) { finish(error); }
    });
  }
  async function check() {
    if (busy) return;
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) {
      report('Updates are available from the website or installed app.'); return;
    }
    if (navigator.onLine === false) { report('You’re offline. Connect to the internet and try again.'); return; }
    busy = true;
    document.querySelectorAll('[data-acs-update-button]').forEach(button => { button.disabled = true; });
    report('Checking for updates…');
    try {
      const registration = await deadline(navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }), 20000);
      await deadline(registration.update(), 20000);
      const candidate = registration.installing || registration.waiting;
      if (candidate) { report('Downloading update…'); await activate(candidate); }
      const worker = registration.active || navigator.serviceWorker.controller;
      if (!worker) throw Error('No active app version was found. Please reload and try again.');
      const version = await versionOf(worker);
      if (version !== pageVersion) { report('Update ready. Restarting…'); location.reload(); }
      else report('This app is up to date.');
    } catch (error) {
      report(error.message && /update|version|install|reload/i.test(error.message)
        ? error.message : 'Could not check for updates. Check your connection and try again.');
    } finally {
      busy = false;
      document.querySelectorAll('[data-acs-update-button]').forEach(button => { button.disabled = false; });
    }
  }
  // Some apps dismiss help on any click/key. Keep updater interactions inside help.
  document.addEventListener('pointerdown', event => {
    if (event.target.closest('[data-acs-update]')) event.stopPropagation();
  }, true);
  document.addEventListener('keydown', event => {
    if (event.key !== 'Escape' && event.target.closest('[data-acs-update]')) event.stopPropagation();
  }, true);
  document.addEventListener('click', event => {
    if (!event.target.closest('[data-acs-update-button]')) return;
    event.preventDefault(); event.stopPropagation(); check();
  }, true);
}());
</script>
</body>
