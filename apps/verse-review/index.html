<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#315b4b"><meta name="description" content="Review Bible verses with a simple spaced repetition schedule."><title>Verse Review — Adless</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg"><script>if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
<style>
:root{color-scheme:light dark;--bg:#f4f6f2;--card:#fff;--ink:#1c2923;--muted:#66756c;--line:#dce4dd;--green:#315b4b;--soft:#e8f0e9}@media(prefers-color-scheme:dark){:root{--bg:#121915;--card:#1c2721;--ink:#e7eee9;--muted:#a3b2a8;--line:#34443a;--green:#9bc6a9;--soft:#29382f}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}.top{padding:12px max(20px,calc((100% - 900px)/2));border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center}.top a,button{color:inherit}.top a{background:var(--green);color:white;padding:7px 12px;border-radius:9px;text-decoration:none;font-weight:650}main{max-width:900px;margin:36px auto;padding:0 20px}h1{font-size:clamp(2rem,6vw,3rem);line-height:1.05;margin:0 0 8px;letter-spacing:-.04em}.sub,.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:1fr 300px;gap:20px;margin-top:26px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}label{display:block;font-weight:650;margin:12px 0 5px}input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}textarea{min-height:90px;resize:vertical}button{border:0;border-radius:10px;padding:10px 14px;background:var(--green);color:white;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:var(--soft);color:var(--ink)}button.danger{background:transparent;color:#b34b43;padding:5px 9px}.count{font-size:2rem;font-weight:750;letter-spacing:-.04em}.card{min-height:185px;display:flex;flex-direction:column;justify-content:center;text-align:center}.ref{font-weight:750;color:var(--green);font-size:1.1rem}.verse{font-size:1.4rem;white-space:pre-wrap;margin:16px 0}.actions{justify-content:center;margin-top:16px}.ratings button{min-width:82px}.ratings small{display:block;font-weight:400;opacity:.85}.hidden{display:none!important}.item{padding:12px 8px;border-bottom:1px solid var(--line);border-radius:10px}.item.selected{background:var(--soft)}.verse-select{display:block;width:100%;background:transparent;color:var(--ink);padding:0;text-align:left;font-weight:inherit}.verse-select:focus-visible{outline:2px solid var(--green);outline-offset:3px}.bulk-controls{margin:0 0 12px}.bulk-controls button{font-size:.88rem;padding:7px 10px}.item:last-child{border:0}.item strong{display:block}.empty{text-align:center;padding:24px;color:var(--muted)}.toolbar{justify-content:space-between;margin-bottom:14px}.due{background:var(--soft);border-radius:999px;padding:4px 10px;font-size:.85rem}.badge{display:inline-block;background:var(--soft);border-radius:999px;padding:2px 8px;font-size:.75rem;color:var(--muted);margin-top:4px}.dialog-backdrop{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:10}.dialog{width:min(100%,420px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 20px 60px #0004}.dialog h2{margin:0 0 8px}.dialog p{margin:0 0 18px;color:var(--muted)}.dialog-actions{justify-content:flex-end}.dialog button.cancel{background:var(--soft);color:var(--ink)}.dialog button.confirm-delete{background:#b34b43;color:white}@media(max-width:700px){.layout{grid-template-columns:1fr}main{margin:26px auto}.panel{padding:18px}}

    .adless-help { position: fixed; right: max(20px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom)); z-index: 1000; background: var(--bg, Canvas); border-radius: 50%; display: inline-block; font: 14px/1.5 system-ui, sans-serif; color: inherit; }
    .adless-help > summary { display: block; list-style: none; cursor: pointer; border: 1px solid currentColor; border-radius: 50%; width: 32px; height: 32px; line-height: 30px; text-align: center; box-sizing: border-box; }
    .adless-help > summary::-webkit-details-marker { display: none; }
    .adless-help > nav { position: absolute; bottom: calc(100% + 8px); right: 0; z-index: 1000; min-width: 130px; padding: 12px; border: 1px solid currentColor; border-radius: 8px; background: var(--bg, Canvas); color: inherit; white-space: nowrap; box-shadow: 0 4px 16px #0002; }
  </style></head><body><header class="top"><span>Verse Review</span></header><main><h1>Keep the words close.</h1><div class="sub">A quiet, private verse practice with spaced reviews. Your verses stay on this device.</div><div class="layout"><section>
<div class="panel" id="reviewPanel"><div class="row toolbar"><span class="due" id="dueCount"></span><span class="muted" id="progress"></span></div><div id="review" class="card"></div></div>
<div class="panel" style="margin-top:18px"><h2 style="margin:0">Add a verse</h2><form id="addForm"><label for="reference">Reference</label><input id="reference" placeholder="John 3:16 or John 3" required maxlength="100"><label for="translation">Default translation for lookup</label><select id="translation"><option value="kjv">King James Version (KJV)</option><option value="asv">American Standard Version (ASV)</option><option value="web">World English Bible (WEB)</option></select><label for="text">Verse text <span class="muted">(optional; leave blank to fetch)</span></label><textarea id="text" placeholder="Paste custom text, or leave blank to fetch the selected translation" maxlength="3000"></textarea><div id="addMessage" class="muted" role="status" aria-live="polite"></div><div class="row" style="justify-content:space-between;margin-top:12px"><span class="muted">Text is saved only in this browser.</span><button id="addButton">Add verse</button></div></form></div></section>
<aside class="panel"><div class="row toolbar"><h2 style="margin:0">Your verses</h2><span class="due" id="total"></span></div><div class="row" style="margin:0 0 14px"><button class="secondary" id="undo" type="button" disabled>Undo</button><button class="secondary" id="redo" type="button" disabled>Redo</button></div><div class="row bulk-controls"><button class="secondary" id="selectAll" type="button">Select all</button><button class="secondary" id="clearSelection" type="button">Clear</button><button class="danger" id="deleteSelected" type="button" disabled>Delete selected</button></div><div id="list"></div></aside></div><div id="deleteDialog" class="dialog-backdrop hidden" role="presentation"><section class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="deleteTitle" aria-describedby="deleteDescription"><h2 id="deleteTitle">Delete verse?</h2><p id="deleteDescription"></p><div class="row dialog-actions"><button type="button" class="cancel" id="cancelDelete">Cancel</button><button type="button" class="confirm-delete" id="confirmDelete">Delete verse</button></div></section></div></main>
<script>
(()=>{'use strict';
const KEY='verse-review-v1',TRANSLATION_KEY='verse-review-translation',TRANSLATIONS={kjv:'King James Version (KJV)',asv:'American Standard Version (ASV)',web:'World English Bible (WEB)'};
let verses=[];try{verses=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(verses))verses=[]}catch(_){verses=[]}
let current=null,revealed=false,undoStack=[],redoStack=[],pendingDelete=null,deleteReturnFocus=null,selectedIds=new Set(),selectionAnchor=null;
const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(verses)),day=86400000;
$('translation').value=localStorage.getItem(TRANSLATION_KEY)||'kjv';$('translation').addEventListener('change',()=>localStorage.setItem(TRANSLATION_KEY,$('translation').value));
function historyButtons(){$('undo').disabled=!undoStack.length;$('redo').disabled=!redoStack.length;$('deleteSelected').disabled=!selectedIds.size;$('deleteSelected').textContent=selectedIds.size?'Delete selected ('+selectedIds.size+')':'Delete selected'}
function snapshot(){undoStack.push(JSON.stringify(verses));if(undoStack.length>50)undoStack.shift();redoStack=[];historyButtons()}
function due(){return verses.filter(v=>v.next<=Date.now())}
function verseLabel(v){return v.customText?'Custom text':(TRANSLATIONS[v.translation]||v.translation||'Public domain text')}
function render(){const queue=due();$('dueCount').textContent=queue.length+' due';$('total').textContent=verses.length;$('progress').textContent=queue.length?'Review one at a time':'All caught up';$('list').innerHTML=verses.length?verses.map(v=>'<div class="item '+(selectedIds.has(v.id)?'selected':'')+'"><button type="button" class="verse-select" data-select="'+esc(v.id)+'" aria-pressed="'+selectedIds.has(v.id)+'"><strong>'+esc(v.ref)+'</strong><span class="badge">'+esc(verseLabel(v))+'</span></button><span class="muted">'+(v.next<=Date.now()?'Due now':'Next '+new Date(v.next).toLocaleDateString())+'</span><button class="danger" data-del="'+esc(v.id)+'" aria-label="Delete '+esc(v.ref)+'">Delete</button></div>').join(''):'<div class="empty">Add your first verse to begin.</div>';if(!current||!queue.some(v=>v.id===current.id))current=queue[0]||null;draw();historyButtons()}
function draw(){const el=$('review');if(!current){el.innerHTML='<div class="empty"><div style="font-size:2rem">✓</div><strong>You’re all caught up.</strong><div class="muted">Add a verse or come back when the next review is due.</div></div>';return}el.innerHTML='<div class="ref">'+esc(current.ref)+'</div><span class="badge">'+esc(verseLabel(current))+'</span><div class="verse">'+(revealed?esc(current.text):'Take a moment to recall it…')+'</div>'+(revealed?(current.copyright?'<div class="muted" style="font-size:.8rem">'+esc(current.copyright)+'</div>':'')+'<div class="muted">How well did you remember?</div><div class="row actions ratings"><button data-rate="0">Again<small>10 min</small></button><button data-rate="1">Hard<small>1 day</small></button><button data-rate="2">Good<small>'+interval(current,2)+'</small></button><button data-rate="3">Easy<small>'+interval(current,3)+'</small></button></div>':'<div class="row actions"><button id="show">Show verse</button></div>')}
function interval(v,r){const n=r===0?0:r===1?1:r===2?Math.max(2,Math.round((v.interval||1)*2)):Math.max(4,Math.round((v.interval||1)*3.5));return n?n+' days':'10 min'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function makeId(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function closeDeleteDialog(restoreFocus){ $('deleteDialog').classList.add('hidden');pendingDelete=null;if(restoreFocus!==false&&deleteReturnFocus&&deleteReturnFocus.isConnected)deleteReturnFocus.focus();deleteReturnFocus=null }
function openDeleteDialog(versesToDelete,button){pendingDelete=Array.isArray(versesToDelete)?versesToDelete:[versesToDelete];deleteReturnFocus=button;const many=pendingDelete.length>1;$('deleteTitle').textContent=many?'Delete '+pendingDelete.length+' verses?':'Delete verse?';$('deleteDescription').textContent=many?'Delete the '+pendingDelete.length+' selected verses? You can undo this deletion.':'Delete '+pendingDelete[0].ref+'? You can undo this deletion.';$('confirmDelete').textContent=many?'Delete '+pendingDelete.length+' verses':'Delete verse';$('deleteDialog').classList.remove('hidden');$('confirmDelete').focus()}
async function lookup(ref,translation){const url='https://api.midvash.com/v1/passages?refs='+encodeURIComponent(ref)+'&version='+encodeURIComponent(translation);const response=await fetch(url);const body=await response.json();if(!response.ok)throw new Error(body.error&&body.error.message||'Could not find that reference.');const item=body.data&&body.data[0];if(!item||item.error)throw new Error(item&&item.error||'No verses found for that reference.');const d=item.data||item;if(!Array.isArray(d.verses)||!d.verses.length)throw new Error('The translation service returned no individual verses.');d.copyright=d.copyright||(body.meta&&body.meta.copyright)||'';return d}
$('addForm').addEventListener('submit',async e=>{e.preventDefault();const ref=$('reference').value.trim(),custom=$('text').value.trim(),translation=$('translation').value,button=$('addButton'),message=$('addMessage');button.disabled=true;message.textContent=custom?'':'Looking up '+ref+'…';try{let entries;if(custom){entries=[{ref,text:custom,customText:true}]}else{const d=await lookup(ref,translation);entries=d.verses.map((text,i)=>({ref:d.verseEnd===d.verse?d.bookName+' '+d.chapter+':'+d.verse:d.bookName+' '+d.chapter+':'+(d.verse+i),text,customText:false,translation:d.version||translation,copyright:d.copyright||''}))}snapshot();const now=Date.now();entries.forEach(v=>verses.push({id:makeId(),...v,interval:0,reps:0,next:now}));save();e.target.reset();$('translation').value=localStorage.getItem(TRANSLATION_KEY)||'kjv';message.textContent='Added '+entries.length+' '+(entries.length===1?'verse.':'verses.');render()}catch(err){message.textContent=err.message||'Lookup failed. Check your connection and reference.'}finally{button.disabled=false}});
$('cancelDelete').addEventListener('click',closeDeleteDialog);$('confirmDelete').addEventListener('click',()=>{if(!pendingDelete)return;const ids=new Set(pendingDelete.map(v=>v.id));snapshot();verses=verses.filter(item=>!ids.has(item.id));if(current&&ids.has(current.id))current=null;selectedIds.clear();selectionAnchor=null;save();closeDeleteDialog(false);render();$('undo').focus()});$('selectAll').addEventListener('click',()=>{selectedIds=new Set(verses.map(v=>v.id));selectionAnchor=verses.length?0:null;render()});$('clearSelection').addEventListener('click',()=>{selectedIds.clear();selectionAnchor=null;render()});$('deleteSelected').addEventListener('click',e=>{const chosen=verses.filter(v=>selectedIds.has(v.id));if(chosen.length)openDeleteDialog(chosen,e.currentTarget)});$('deleteDialog').addEventListener('click',e=>{if(e.target===$('deleteDialog'))closeDeleteDialog()});document.addEventListener('keydown',e=>{if($('deleteDialog').classList.contains('hidden'))return;if(e.key==='Escape'){closeDeleteDialog();return}if(e.key==='Tab'){const controls=[$('cancelDelete'),$('confirmDelete')],first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});$('undo').addEventListener('click',()=>{if(!undoStack.length)return;redoStack.push(JSON.stringify(verses));verses=JSON.parse(undoStack.pop());selectedIds.clear();selectionAnchor=null;current=null;revealed=false;save();render()});$('redo').addEventListener('click',()=>{if(!redoStack.length)return;undoStack.push(JSON.stringify(verses));verses=JSON.parse(redoStack.pop());selectedIds.clear();selectionAnchor=null;current=null;revealed=false;save();render()});
document.addEventListener('click',e=>{const select=e.target.closest('[data-select]');if(select){const id=select.dataset.select,index=verses.findIndex(v=>v.id===id),additive=e.metaKey||e.ctrlKey;if(e.shiftKey&&selectionAnchor!==null){if(!additive)selectedIds.clear();const lo=Math.min(selectionAnchor,index),hi=Math.max(selectionAnchor,index);for(let i=lo;i<=hi;i++)selectedIds.add(verses[i].id)}else if(additive){if(selectedIds.has(id))selectedIds.delete(id);else selectedIds.add(id);selectionAnchor=index}else{selectedIds.clear();selectedIds.add(id);selectionAnchor=index}render();const focusTarget=document.querySelector('[data-select="'+id+'"]');if(focusTarget)focusTarget.focus();return}if(e.target.id==='show'){revealed=true;draw()}const rate=e.target.closest('[data-rate]');if(rate&&current){const r=+rate.dataset.rate,v=current;v.reps++;if(r===0){v.interval=0;v.next=Date.now()+10*60*1000}else{v.interval=r===1?1:r===2?Math.max(2,Math.round((v.interval||1)*2)):Math.max(4,Math.round((v.interval||1)*3.5));v.next=Date.now()+v.interval*day}save();revealed=false;current=null;render()}const del=e.target.closest('[data-del]');if(del){const v=verses.find(item=>item.id===del.dataset.del);if(!v)return;openDeleteDialog(v,del)}});document.addEventListener('keydown',e=>{const active=e.target.closest&&e.target.closest('[data-select]');if(!active||e.altKey||(!e.shiftKey&&e.key!=='ArrowDown'&&e.key!=='ArrowUp'))return;const index=verses.findIndex(v=>v.id===active.dataset.select),next=Math.max(0,Math.min(verses.length-1,index+(e.key==='ArrowDown'?1:-1)));if(next===index)return;e.preventDefault();if(e.shiftKey){if(selectionAnchor===null)selectionAnchor=index;if(!(e.metaKey||e.ctrlKey))selectedIds.clear();const lo=Math.min(selectionAnchor,next),hi=Math.max(selectionAnchor,next);for(let i=lo;i<=hi;i++)selectedIds.add(verses[i].id);render()}const target=document.querySelector('[data-select="'+verses[next].id+'"]');if(target)target.focus()});render()})();
</script><details class="adless-help"><summary aria-label="Help and navigation" title="Help and navigation">?</summary><nav aria-label="App navigation"><a href="../../" aria-label="Back to all apps" style="color:inherit;text-decoration:underline">← Adless</a></nav></details>
</body></html>
