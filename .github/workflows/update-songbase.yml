name: Update Songbase library

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pages: write

concurrency:
  group: update-songbase-library
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Download and validate the complete Songbase library
        run: python3 apps/show-songs/songbasescraper.py
      - name: Commit changed songs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add apps/show-songs/songbase_all.json
          if git diff --cached --quiet; then
            echo "Songbase library is unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Show Songs Songbase library"
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      # GITHUB_TOKEN pushes do not trigger Pages publication automatically.
      # Also retry publication after a prior run committed successfully but its build failed.
      - name: Publish the current revision on GitHub Pages when needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision=$(git rev-parse HEAD)
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')" = "workflow" ]; then
            run=$(gh run list --workflow deploy-pages.yml --branch "$DEFAULT_BRANCH" --commit "$revision" \
              --limit 1 --json status,conclusion --jq '.[] | if .status == "completed" then .conclusion else .status end')
            case "$run" in
              success|queued|in_progress|pending|requested|waiting) ;;
              *) gh workflow run deploy-pages.yml --ref "$DEFAULT_BRANCH" ;;
            esac
          else
            published=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '.commit')
            build_status=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '.status')
            if [ "$published" != "$revision" ] || [ "$build_status" = "errored" ]; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
            fi
          fi
