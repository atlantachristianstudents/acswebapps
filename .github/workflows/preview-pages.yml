name: PR Preview Deployments

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - closed

  issue_comment:
    types:
      - created

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare preview
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: write
      issues: write

    outputs:
      run: ${{ steps.prepare.outputs.run }}
      action: ${{ steps.prepare.outputs.action }}
      pr_number: ${{ steps.prepare.outputs.pr_number }}
      pr_sha: ${{ steps.prepare.outputs.pr_sha }}
      pr_repository: ${{ steps.prepare.outputs.pr_repository }}

    steps:
      - name: Check event and permissions
        id: prepare
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const event = context.eventName;
              let pr;
              let action;

              if (event === "pull_request_target") {
                pr = context.payload.pull_request;

                if (!pr) {
                  core.setOutput("run", "false");
                  return;
                }

                action = context.payload.action === "closed"
                  ? "remove"
                  : "deploy";

              } else if (event === "issue_comment") {
                const issue = context.payload.issue;
                const comment = context.payload.comment;

                if (!issue?.pull_request) {
                  core.info("Comment is not on a pull request.");
                  core.setOutput("run", "false");
                  return;
                }

                const command = comment.body.trim();

                const allowedCommands = [
                  "/deploy-preview",
                  "/update-preview",
                  "/remove-preview"
                ];

                if (!allowedCommands.includes(command)) {
                  core.info("No recognized preview command.");
                  core.setOutput("run", "false");
                  return;
                }

                core.info(`Recognized command: ${command}`);
                core.info(`Comment author: ${comment.user.login}`);

                const result = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: issue.number
                });

                pr = result.data;

                if (pr.state !== "open") {
                  core.warning("The pull request is not open.");
                  core.setOutput("run", "false");
                  return;
                }

                const isPRCreator =
                  comment.user.login.toLowerCase() ===
                  pr.user.login.toLowerCase();

                let isAdmin = false;

                if (!isPRCreator) {
                  try {
                    const permissionResult =
                      await github.rest.repos.getCollaboratorPermissionLevel({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        username: comment.user.login
                      });

                    isAdmin =
                      permissionResult.data.permission === "admin";

                    core.info(
                      `GitHub permission: ${permissionResult.data.permission}`
                    );

                  } catch (error) {
                    core.error("Failed to check repository permissions.");
                    core.error(`Message: ${error.message}`);
                    core.error(`HTTP status: ${error.status || "unknown"}`);

                    if (error.response?.data) {
                      core.error(JSON.stringify(
                        error.response.data,
                        null,
                        2
                      ));
                    }

                    throw error;
                  }
                }

                if (!isPRCreator && !isAdmin) {
                  core.warning(
                    `${comment.user.login} is not the PR creator or a repository admin.`
                  );

                  core.setOutput("run", "false");
                  return;
                }

                core.info(
                  isPRCreator
                    ? "Authorized: PR creator."
                    : "Authorized: repository administrator."
                );

                action = command === "/remove-preview"
                  ? "remove"
                  : "deploy";

              } else {
                core.setOutput("run", "false");
                return;
              }

              if (action === "deploy" && !pr.head.repo) {
                core.warning("The PR source repository is unavailable.");
                core.setOutput("run", "false");
                return;
              }

              core.setOutput("run", "true");
              core.setOutput("action", action);
              core.setOutput("pr_number", String(pr.number));
              core.setOutput("pr_sha", pr.head.sha);
              core.setOutput(
                "pr_repository",
                pr.head.repo?.full_name || ""
              );

              core.info("================================");
              core.info("PREVIEW REQUEST PREPARED");
              core.info(`Action: ${action}`);
              core.info(`PR: #${pr.number}`);
              core.info(`Commit: ${pr.head.sha}`);
              core.info(`Repository: ${pr.head.repo?.full_name || "unavailable"}`);
              core.info("================================");

            } catch (error) {
              core.error("PREPARATION FAILED");
              core.error(`Name: ${error.name}`);
              core.error(`Message: ${error.message}`);
              core.error(`HTTP status: ${error.status || "unknown"}`);

              if (error.response?.data) {
                core.error("Complete GitHub API response:");
                core.error(JSON.stringify(error.response.data, null, 2));
              }

              core.error(error.stack || "Stack trace unavailable.");
              throw error;
            }

  deploy:
    name: Deploy or clean PR preview
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Check out PR source
        if: needs.prepare.outputs.action == 'deploy'
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.prepare.outputs.pr_repository }}
          ref: ${{ needs.prepare.outputs.pr_sha }}
          path: pr-source
          fetch-depth: 1
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Validate PR files and assemble preview
        if: needs.prepare.outputs.action == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFINE_RELEASE: define-english-2026-11-18-r2
          DEFINE_SHA256: 68c77fb6d43d8d96167282b49981af2f9622e44f472f73f6e3a6543cbf96c9c3
        run: |
          set -Eeuo pipefail

          trap 'status=$?; echo "::error::Site preparation failed at line $LINENO (exit $status)."; exit "$status"' ERR

          source_dir="$GITHUB_WORKSPACE/pr-source"
          site="$RUNNER_TEMP/site"
          archive="$RUNNER_TEMP/$DEFINE_RELEASE.tar"

          echo "=========================================="
          echo "PREPARING PR PREVIEW"
          echo "=========================================="
          echo "Source: $source_dir"
          echo "Release: $DEFINE_RELEASE"

          python3 - <<'PY'
          import subprocess
          import sys

          result = subprocess.check_output(
              ["git", "ls-tree", "-rz", "--full-tree", "HEAD"],
              cwd="pr-source"
          )

          rejected = []

          for entry in result.split(b"\0"):
              if not entry:
                  continue

              metadata, path = entry.split(b"\t", 1)
              mode = metadata.split(b" ", 1)[0]

              if mode in (b"120000", b"160000"):
                  rejected.append(
                      path.decode("utf-8", errors="replace")
                  )

          if rejected:
              print("Preview rejected: symlinks and submodules are not allowed:")

              for path in rejected:
                  print(f"  {path}")

              sys.exit(1)

          print("File validation passed.")
          PY

          mkdir -p "$site"

          rsync -a --exclude='.git' "$source_dir/" "$site/"

          rm -f "$site/CNAME"

          echo "Downloading release archive..."

          gh release download "$DEFINE_RELEASE" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$DEFINE_RELEASE.tar" \
            --output "$archive"

          echo "Verifying release archive SHA-256..."

          printf '%s  %s\n' "$DEFINE_SHA256" "$archive" \
            | sha256sum --check

          mkdir -p "$site/apps/define"

          echo "Extracting release files..."

          tar -xf "$archive" \
            -C "$site/apps/define" \
            --wildcards 'data/releases/*'

          touch "$site/.nojekyll"

          echo "Preview site assembled successfully."

      - name: Check Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "CLOUDFLARE CONFIGURATION"
          echo "=========================================="

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing."
            exit 1
          fi

          if [ -z "$CLOUDFLARE_PAGES_PROJECT" ]; then
            echo "::error::CLOUDFLARE_PAGES_PROJECT is missing."
            exit 1
          fi

          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::Invalid Cloudflare account ID."
            exit 1
          fi

          # Strict project allowlist.
          # This workflow must never operate on production.

          if [ "$CLOUDFLARE_PAGES_PROJECT" != "acswebapps-preview" ]; then
            echo "::error::Unexpected Pages project."
            echo "Expected: acswebapps-preview"
            echo "Received: $CLOUDFLARE_PAGES_PROJECT"
            echo "Refusing to continue."
            exit 1
          fi

          echo "Account ID format: valid"
          echo "Project: $CLOUDFLARE_PAGES_PROJECT"
          echo "API token: present (value hidden)"
          echo "Configuration verified."

      - name: Check existing deployment
        id: existing
        if: needs.prepare.outputs.action == 'deploy'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          PR_SHA: ${{ needs.prepare.outputs.pr_sha }}
        run: |
          set -Eeuo pipefail

          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT/deployments"

          all_deployments="$RUNNER_TEMP/existing-deployments.jsonl"
          : > "$all_deployments"

          echo "=========================================="
          echo "CHECKING EXISTING DEPLOYMENTS"
          echo "PR: #$PR_NUMBER"
          echo "Branch: pr-$PR_NUMBER"
          echo "=========================================="

          page=1
          total_pages=1

          while (( page <= total_pages )); do
            response_file="$RUNNER_TEMP/existing-page-$page.json"

            echo "Fetching page $page..."

            set +e
            status=$(curl -sS -G \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --data-urlencode "env=preview" \
              --data-urlencode "per_page=100" \
              --data-urlencode "page=$page" \
              -o "$response_file" \
              -w '%{http_code}' \
              "$API")
            curl_status=$?
            set -e

            if (( curl_status != 0 )); then
              echo "::error::Cloudflare connection failed."
              echo "Curl exit code: $curl_status"
              cat "$response_file" 2>/dev/null || true
              exit 1
            fi

            if [ "$status" != "200" ]; then
              echo "::error::Cloudflare returned HTTP $status."
              echo "Complete response:"
              jq '.' "$response_file" 2>/dev/null || cat "$response_file"
              exit 1
            fi

            if ! jq -e '.success == true' "$response_file" >/dev/null; then
              echo "::error::Cloudflare returned success=false."
              jq '.' "$response_file"
              exit 1
            fi

            jq -c '.result[]?' "$response_file" >> "$all_deployments"

            total_pages=$(jq -r '.result_info.total_pages // 1' "$response_file")

            if ! [[ "$total_pages" =~ ^[0-9]+$ ]]; then
              echo "::error::Invalid pagination response."
              jq '.' "$response_file"
              exit 1
            fi

            ((page += 1))
          done

          latest_sha=$(jq -s -r \
            --arg branch "pr-$PR_NUMBER" \
            --arg project "$CLOUDFLARE_PAGES_PROJECT" \
            '
            [
              .[]
              | select(
                  .environment == "preview"
                  and .project_name == $project
                  and .deployment_trigger.metadata.branch == $branch
                )
            ]
            | sort_by(.created_on)
            | last
            | if .latest_stage.status == "success"
              then (.deployment_trigger.metadata.commit_hash // "")
              else ""
              end
            ' "$all_deployments")

          echo "Latest successfully deployed SHA: ${latest_sha:-none}"
          echo "Requested SHA: $PR_SHA"

          if [ "$latest_sha" = "$PR_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Current commit is already deployed."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "A new deployment is required."
          fi

      - name: Deploy to Cloudflare Pages
        if: needs.prepare.outputs.action == 'deploy' && steps.existing.outputs.skip != 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          PR_SHA: ${{ needs.prepare.outputs.pr_sha }}
        run: |
          set -uo pipefail

          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number."
            exit 1
          fi

          echo "=========================================="
          echo "CLOUDFLARE PAGES DEPLOYMENT"
          echo "=========================================="
          echo "Project: $CLOUDFLARE_PAGES_PROJECT"
          echo "Branch: pr-$PR_NUMBER"
          echo "Commit: $PR_SHA"
          echo "=========================================="

          log="$RUNNER_TEMP/wrangler-deploy.log"

          set +e

          npx --yes wrangler@4.166.0 pages deploy "$RUNNER_TEMP/site" \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "pr-$PR_NUMBER" \
            --commit-hash "$PR_SHA" \
            2>&1 | tee "$log"

          deploy_status=${PIPESTATUS[0]}

          set -e

          echo ""
          echo "Wrangler exit code: $deploy_status"

          if (( deploy_status != 0 )); then
            echo "::error::Cloudflare Pages deployment failed."
            echo "Complete Wrangler output:"
            cat "$log"
            exit "$deploy_status"
          fi

          echo "Deployment command completed successfully."

      - name: Delete older PR deployments
        if: >-
          needs.prepare.outputs.action == 'deploy' ||
          needs.prepare.outputs.action == 'remove'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number. Refusing cleanup."
            exit 1
          fi

          if [ "$CLOUDFLARE_PAGES_PROJECT" != "acswebapps-preview" ]; then
            echo "::error::Unexpected project. Refusing cleanup."
            exit 1
          fi

          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT/deployments"

          all_deployments="$RUNNER_TEMP/all-deployments.jsonl"
          : > "$all_deployments"

          failures="$RUNNER_TEMP/deletion-failures.txt"
          : > "$failures"

          echo "=========================================="
          echo "PR DEPLOYMENT CLEANUP"
          echo "=========================================="
          echo "Project: $CLOUDFLARE_PAGES_PROJECT"
          echo "PR: #$PR_NUMBER"
          echo "Branch: pr-$PR_NUMBER"
          echo "=========================================="

          page=1
          total_pages=1

          while (( page <= total_pages )); do
            response_file="$RUNNER_TEMP/cleanup-page-$page.json"

            echo "Fetching deployment page $page..."

            set +e
            status=$(curl -sS -G \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --data-urlencode "env=preview" \
              --data-urlencode "per_page=100" \
              --data-urlencode "page=$page" \
              -o "$response_file" \
              -w '%{http_code}' \
              "$API")
            curl_status=$?
            set -e

            if (( curl_status != 0 )); then
              echo "::error::Cloudflare API connection failed."
              echo "Curl exit code: $curl_status"
              cat "$response_file" 2>/dev/null || true
              exit 1
            fi

            if [ "$status" != "200" ]; then
              echo "::error::Cloudflare returned HTTP $status."
              echo "Complete API response:"
              jq '.' "$response_file" 2>/dev/null || cat "$response_file"
              exit 1
            fi

            if ! jq -e '.success == true' "$response_file" >/dev/null; then
              echo "::error::Cloudflare returned success=false."
              jq '.' "$response_file"
              exit 1
            fi

            jq -c '.result[]?' "$response_file" >> "$all_deployments"

            total_pages=$(jq -r '.result_info.total_pages // 1' "$response_file")

            if ! [[ "$total_pages" =~ ^[0-9]+$ ]]; then
              echo "::error::Invalid pagination response."
              jq '.' "$response_file"
              exit 1
            fi

            ((page += 1))
          done

          # Verify exact project, preview environment and branch.
          # Never select production deployments.

          mapfile -t deployments < <(
            jq -s -r \
              --arg branch "pr-$PR_NUMBER" \
              --arg project "$CLOUDFLARE_PAGES_PROJECT" \
              '
              [
                .[]
                | select(
                    .environment == "preview"
                    and .project_name == $project
                    and .deployment_trigger.metadata.branch == $branch
                  )
              ]
              | sort_by(.created_on)
              | reverse
              | .[]
              | .id
              ' "$all_deployments"
          )

          count="${#deployments[@]}"

          echo ""
          echo "Matching preview deployments: $count"

          if (( count == 0 )); then
            echo "No deployments found for PR #$PR_NUMBER."
            exit 0
          fi

          # Retain the newest deployment.
          # Cloudflare does not permit deleting the latest
          # deployment for a branch.

          newest="${deployments[0]}"

          echo "Latest deployment retained: $newest"

          if (( count == 1 )); then
            echo "Only one deployment exists. Nothing to delete."
            exit 0
          fi

          deleted=0
          failed=0

          for deployment_id in "${deployments[@]:1}"; do
            echo ""
            echo "=========================================="
            echo "DELETING OLDER DEPLOYMENT"
            echo "=========================================="
            echo "Deployment ID: $deployment_id"

            if [[ ! "$deployment_id" =~ ^[a-fA-F0-9-]{36}$ ]]; then
              echo "::error::Invalid deployment UUID: $deployment_id"
              printf '%s\n' "$deployment_id: invalid UUID" >> "$failures"
              ((failed += 1))
              continue
            fi

            output="$RUNNER_TEMP/delete-$deployment_id.json"

            set +e
            status=$(curl -sS \
              -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -o "$output" \
              -w '%{http_code}' \
              "$API/$deployment_id?force=true")
            curl_status=$?
            set -e

            if (( curl_status != 0 )); then
              echo "::error::Network failure deleting $deployment_id."
              echo "Curl exit code: $curl_status"
              cat "$output" 2>/dev/null || true

              printf '%s\n' "$deployment_id: network failure (curl $curl_status)" >> "$failures"

              ((failed += 1))
              continue
            fi

            echo "HTTP status: $status"
            echo "Complete Cloudflare response:"

            jq '.' "$output" 2>/dev/null || cat "$output"

            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Deletion failed for $deployment_id (HTTP $status)."

              printf '%s\n' "$deployment_id: HTTP $status" >> "$failures"

              ((failed += 1))
              continue
            fi

            if ! jq -e '.success == true' "$output" >/dev/null; then
              echo "::error::Cloudflare returned success=false for $deployment_id."

              error_details=$(jq -c \
                '{errors, messages}' "$output" 2>/dev/null || true)

              printf '%s\n' "$deployment_id: Cloudflare success=false: $error_details" >> "$failures"

              ((failed += 1))
              continue
            fi

            echo "Successfully deleted $deployment_id."
            ((deleted += 1))
          done

          echo ""
          echo "=========================================="
          echo "CLEANUP SUMMARY"
          echo "=========================================="
          echo "PR: #$PR_NUMBER"
          echo "Project: $CLOUDFLARE_PAGES_PROJECT"
          echo "Deployments found: $count"
          echo "Latest retained: $newest"
          echo "Older deployments deleted: $deleted"
          echo "Deletion failures: $failed"
          echo "Production deployments: untouched"
          echo "Pages project: untouched"
          echo "=========================================="

          if (( failed > 0 )); then
            echo "::error::One or more older deployments could not be deleted."

            echo ""
            echo "COMPLETE DELETION FAILURE LIST:"
            cat "$failures"

            exit 1
          fi

          echo "All eligible older deployments were processed successfully."

      - name: Update PR comment
        if: success()
        uses: actions/github-script@v8
        env:
          ACTION: ${{ needs.prepare.outputs.action }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        with:
          script: |
            try {
              const marker = "<!-- acswebapps-preview -->";
              const action = process.env.ACTION;
              const number = Number(process.env.PR_NUMBER);
              const project = process.env.CLOUDFLARE_PAGES_PROJECT;

              const url =
                `https://pr-${number}.${project}.pages.dev/`;

              const body = action === "remove"
                ? `${marker}
            ## PR preview cleanup completed

            Older preview deployments have been deleted.

            Cloudflare retains the latest deployment for this branch because its API does not permit deleting the latest branch deployment.

            The shared Pages project and production deployments are untouched.

            **Remaining preview URL:**
            ${url}`
                : `${marker}
            ## PR preview deployed

            Your preview is ready:

            **${url}**

            Older deployments for this PR are cleaned up automatically whenever a new deployment is published.

            Use \`/deploy-preview\` or \`/update-preview\` to deploy again.

            Use \`/remove-preview\` to clean up older deployments.`;

              core.info("================================");
              core.info("UPDATING PR PREVIEW COMMENT");
              core.info(`PR: #${number}`);
              core.info(`Action: ${action}`);
              core.info(`Preview: ${url}`);
              core.info("================================");

              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                  per_page: 100
                }
              );

              const existing = comments.find(comment =>
                comment.body?.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body
                });

                core.info("Successfully updated existing comment.");

              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                  body
                });

                core.info("Successfully created new comment.");
              }

            } catch (error) {
              core.error("================================");
              core.error("PR COMMENT UPDATE FAILED");
              core.error("================================");
              core.error(`Name: ${error.name}`);
              core.error(`Message: ${error.message}`);
              core.error(`HTTP status: ${error.status || "unknown"}`);

              if (error.response) {
                core.error("Complete GitHub API response:");

                core.error(JSON.stringify(
                  error.response.data,
                  null,
                  2
                ));

                core.error("Response headers:");

                core.error(JSON.stringify(
                  error.response.headers,
                  null,
                  2
                ));
              }

              if (error.errors) {
                core.error("Additional errors:");

                core.error(JSON.stringify(
                  error.errors,
                  null,
                  2
                ));
              }

              core.error(
                error.stack || "Stack trace unavailable."
              );

              throw error;
            }

      - name: Report workflow failure
        if: failure()
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "PR PREVIEW WORKFLOW FAILED"
          echo "=========================================="
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Run ID: $GITHUB_RUN_ID"
          echo "Attempt: $GITHUB_RUN_ATTEMPT"
          echo ""
          echo "Inspect the failed step above for the"
          echo "complete error and API response."
