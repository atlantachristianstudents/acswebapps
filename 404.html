<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — ACS Web Apps</title>
  <link id="favicon" rel="icon" href="/acswebapps/assets/favicon.svg" type="image/svg+xml">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f7f8fa; color: #1a2230; padding: 1.5rem; }
    @media (prefers-color-scheme: dark) { body { background: #0f141b; color: #e8ecf2; } a { color: #7fa6dc; } }
    h1 { font-size: 4rem; margin: 0; }
    a { color: #61a4ff; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>We couldn't find that page.</p>
    <p><a id="back-link" href="/acswebapps/">← Back to all apps</a></p>
  </main>
  <script>
    // The app directory lives at the site root on most hosts, but the GitHub Pages
    // project site serves it from /acswebapps/. Pick the base at runtime so the
    // back link (and favicon) resolve correctly on both.
    (function () {
      var base = location.hostname === "atlantachristianstudents.github.io" ? "/acswebapps/" : "/";
      var back = document.getElementById("back-link");
      if (back) back.setAttribute("href", base);
      var icon = document.getElementById("favicon");
      if (icon) icon.setAttribute("href", base + "assets/favicon.svg");
    })();
  </script>
</body>
</html>
